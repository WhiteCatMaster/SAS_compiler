name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Constrain BLAS/OpenMP thread pools (numpy/scipy/scikit-learn) to avoid
  # thread oversubscription hangs on shared CI runners, and force a
  # non-interactive matplotlib backend regardless of import order.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  MPLBACKEND: "Agg"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: |
          set +e
          pytest tests/ -v > /tmp/pytest_out.txt 2>&1
          code=$?
          cat /tmp/pytest_out.txt
          if [ $code -ne 0 ]; then
            msg=$(tail -c 900 /tmp/pytest_out.txt | tr '\n' '~')
            echo "::error::PYTEST FAILED (exit $code): $msg"
          fi
          exit $code
      - name: Compile and run all examples
        run: |
          for f in examples/*.sas; do
            echo "=== $f ==="
            python -m sas_compiler.cli "$f" --run
          done
