[project]
name = "sas-compiler"
version = "0.1.0"
description = "A SAS-to-Python compiler (macro processor, DATA step / PROC parser, pandas/duckdb codegen)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "duckdb>=0.9",
    "statsmodels>=0.14",
    "scipy>=1.10",
    "sqlalchemy>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
sasc = "sas_compiler.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sas_compiler"]
